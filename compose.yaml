name: frame-studio
services:
  db:
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-frame_studio}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/02-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    volumes: ["mail_data:/data"]
    environment:
      MP_DATABASE: /data/mailpit.db
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    restart: unless-stopped
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-frame-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes: ["object_data:/data"]
volumes:
  postgres_data:
  mail_data:
  object_data:
